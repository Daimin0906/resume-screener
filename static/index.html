<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能简历筛选系统</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <h1>🧠 智能简历筛选系统</h1>
    <div class="status">
      后端状态：<span id="health-badge" class="badge badge-unknown">检测中…</span>
    </div>
  </header>

  <main class="layout">
    <!-- 左列：上传 + 简历列表 -->
    <section class="panel">
      <h2>1. 上传简历</h2>
      <p class="hint">支持 .txt / .pdf / .md，可一次选择多个文件（后台并行解析）。</p>
      <input type="file" id="resume-files" multiple accept=".txt,.pdf,.md" />
      <button id="upload-btn" class="btn primary">上传</button>
      <button id="email-fetch-btn" class="btn">抓取邮箱简历</button>
      <div id="upload-log" class="log"></div>

      <h2>已上传简历 <span id="resume-count" class="muted"></span></h2>
      <div class="list-toolbar">
        <label class="sel-all"><input type="checkbox" id="sel-all-cb" /> 全选</label>
        <span id="sel-count" class="muted"></span>
        <button id="batch-del-btn" class="btn btn-danger" disabled>删除选中</button>
        <button id="refresh-btn" class="btn">刷新列表</button>
      </div>
      <ul id="resume-list" class="resume-list"></ul>
    </section>

    <!-- 右列：自动筛选 + 规则 -->
    <section class="panel">
      <h2>⚙️ 自动筛选 <span id="auto-screen-status" class="muted"></span></h2>
      <p class="hint">填写默认岗位要求并保存后，每次邮箱抓取到新简历会自动筛选，也可点「开始筛选」立即执行。</p>
      <textarea id="default-query-text" rows="4" placeholder="填写默认岗位要求（JD 文本），自动筛选用它…"></textarea>
      <button id="run-auto-screen-btn" class="btn primary">开始筛选</button>
      <button id="save-default-query-btn" class="btn">保存默认岗位要求</button>
      <div id="auto-screen-log" class="log"></div>
      <div id="auto-screen-summary" class="auto-summary"></div>
      <div id="auto-screen-results" class="results"></div>

      <h2>2. 筛选规则 <span id="rules-meta" class="muted"></span></h2>
      <p class="hint">AI 分类被人工纠正后，可总结纠正规律生成筛选规则，下次筛选自动生效。
        规则更新后建议「换一批简历」重新筛选，或点击「对比验证」查看新旧规则的效果差异。</p>
      <div id="rules-box" class="rules-box">尚未总结筛选规则</div>
      <button id="summarize-rules-btn" class="btn primary">总结筛选规则</button>
      <button id="compare-rules-btn" class="btn">对比验证</button>
      <div id="rules-log" class="log"></div>
      <div id="compare-box" class="compare-box" hidden></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
