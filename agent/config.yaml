# 轻量简历智能体配置

collect:
  source: folder            # folder / imap / boss(待调研)
  folder_path: ./agent/inbox   # 简历放入此目录（支持子目录）
  data_dir: ./agent/data       # 已处理记录存储
  # imap 模式：
  # source: imap
  # host: imap.qq.com
  # user: xxx@qq.com
  # password: 授权码
  # port: 993

screen:
  required_skills: ["Python", "FastAPI"]   # 必需技能（命中比例≥阈值算过）
  skill_hit_ratio: 0.6                     # 0.6 = 2 个技能命中 1 个即可
  min_experience_years: 3                  # 最少经验年限
  min_education: "本科"                    # 大专/本科/硕士/博士（空=不限）
  locations: []                            # 期望地点，如 ["北京", "上海"]；空=不限
  # required_gender: ""                    # 可选硬性：男/女
  # min_age: 0                             # 可选：年龄范围

push:
  feishu_webhook: ""   # 飞书群自定义机器人 Webhook；留空则结果输出到控制台
